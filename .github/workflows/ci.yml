# Integración continua de Sysadmin.
# En cada push y pull request: valida el dataset y las traducciones, comprueba que el CSS
# compilado está al día y ejecuta las pruebas de interfaz (escritorio y móvil).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Las Actions se fijan por commit (SHA) y no por etiqueta: una etiqueta se puede mover
# y colar código en la CI. Para actualizarlas, cambia el SHA y el comentario de versión.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar datos y CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar dataset, traducciones y textos de interfaz
        run: npm run validate
      - name: Comprobar que assets/tailwind.css está compilado y al día
        run: |
          npm run build:css
          git diff --exit-code assets/tailwind.css || (echo "::error::assets/tailwind.css no está al día. Ejecuta 'npm run build:css' y sube el resultado." && exit 1)

  pruebas:
    name: Pruebas de interfaz (Playwright)
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas
        run: npx playwright test
      - name: Guardar informe si fallan
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
