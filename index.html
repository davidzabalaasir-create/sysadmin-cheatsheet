<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sysadmin · Comandos para administradores de sistemas (Linux & Windows)</title>
  <meta name="description" content="Manual de campo de comandos para administradores de sistemas y redes: Linux (Bash) y Windows (CMD/PowerShell/Active Directory)." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23141310'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23ffb454'>§</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Instrument Serif"', "Georgia", "serif"],
            sans: ['"IBM Plex Sans"', "system-ui", "sans-serif"],
            mono: ['"IBM Plex Mono"', "ui-monospace", "Consolas", "monospace"]
          },
          colors: {
            paper: { DEFAULT: "#141310", 2: "#1b1a16", 3: "#23211c", line: "#2f2c25", line2: "#3d3930" },
            bone:  { DEFAULT: "#ece6d9", dim: "#a39d90", mute: "#6f6a5f" },
            amber: { DEFAULT: "#ffb454", soft: "#ffb45422" },
            sky:   { DEFAULT: "#8cc4ff", soft: "#8cc4ff22" },
            sage:  { DEFAULT: "#9fd8a6" },
            blood: { DEFAULT: "#ff6b5e", soft: "#ff6b5e1f" }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="bg-paper text-bone font-sans antialiased">

  <!-- ===================== MASTHEAD ===================== -->
  <header class="border-b border-paper-line">
    <div class="max-w-[1500px] mx-auto px-5 lg:px-10 pt-6 lg:pt-10 pb-5">
      <div class="flex items-start justify-between gap-6">
        <div class="min-w-0">
          <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-bone-mute">Vol. 1 — Linux · Windows · Active Directory</p>
          <h1 class="font-serif text-[2.6rem] leading-[0.95] sm:text-6xl lg:text-7xl text-bone mt-2">
            Sys<em class="text-amber">admin</em>
          </h1>
        </div>
        <div id="counter" class="hidden md:block text-right shrink-0 pt-2"></div>
      </div>

      <!-- Barra de control -->
      <div class="mt-7 flex flex-col lg:flex-row lg:items-center gap-4">
        <!-- Buscador -->
        <label class="relative flex-1 block">
          <span class="sr-only">Buscar comandos</span>
          <span class="absolute left-0 top-1/2 -translate-y-1/2 font-mono text-amber text-lg select-none">?</span>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
            placeholder="Busca por comando, tarea o palabra clave — p. ej. «puerto abierto», «bloquear cuenta»"
            class="w-full bg-transparent border-0 border-b-2 border-paper-line2 focus:border-amber pl-7 pr-24 py-3 text-lg sm:text-xl font-serif italic placeholder:text-bone-mute placeholder:not-italic placeholder:font-sans placeholder:text-base focus:outline-none transition-colors" />
          <span class="absolute right-0 top-1/2 -translate-y-1/2 hidden sm:flex gap-1">
            <kbd class="key">Ctrl</kbd><kbd class="key">K</kbd>
          </span>
        </label>

        <!-- Selector SO -->
        <div id="osSwitch" class="flex shrink-0 border border-paper-line2 rounded-full p-1 font-mono text-xs" role="tablist" aria-label="Sistema operativo"></div>
      </div>
    </div>

    <!-- Índice de categorías -->
    <nav class="border-t border-paper-line" aria-label="Categorías">
      <div class="relative max-w-[1500px] mx-auto">
        <button id="railPrev" type="button" aria-label="Ver categorías anteriores" tabindex="-1"
          class="rail-arrow left-0 pl-2 lg:pl-5 pr-8 bg-gradient-to-r from-paper via-paper/95 to-transparent">
          <span class="rail-btn"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg></span>
        </button>
        <div id="catRail" class="relative px-5 lg:px-10 flex gap-1 overflow-x-auto no-scrollbar scroll-smooth cursor-grab select-none"></div>
        <button id="railNext" type="button" aria-label="Ver más categorías" tabindex="-1"
          class="rail-arrow right-0 pr-2 lg:pr-5 pl-8 bg-gradient-to-l from-paper via-paper/95 to-transparent">
          <span class="rail-btn"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- ===================== CUERPO ===================== -->
  <div class="max-w-[1500px] mx-auto lg:px-10 lg:grid lg:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)] lg:gap-10">

    <!-- Índice / lista -->
    <section class="min-w-0 px-5 lg:px-0 py-6" aria-label="Lista de comandos">
      <div class="flex items-center justify-between gap-3 mb-4">
        <p id="listMeta" class="font-mono text-xs text-bone-mute"></p>
        <div id="riskToggles" class="flex gap-1.5"></div>
      </div>
      <div id="list"></div>
      <div id="empty" class="hidden py-20 text-center">
        <p class="font-serif text-4xl italic text-bone-dim">Nada por aquí.</p>
        <p class="text-sm text-bone-mute mt-2">Prueba otra palabra, cambia de sistema o restablece los filtros.</p>
        <button id="btnReset" class="mt-5 font-mono text-xs uppercase tracking-widest text-amber border-b border-amber/40 hover:border-amber pb-0.5">Restablecer filtros</button>
      </div>
    </section>

    <!-- Ficha de detalle -->
    <aside id="detailWrap"
      class="fixed inset-0 z-50 translate-y-full lg:translate-y-0 transition-transform duration-300 bg-paper
             lg:static lg:z-auto lg:transition-none lg:bg-transparent">
      <div class="h-full lg:h-auto lg:sticky lg:top-0 lg:py-6">
        <div id="detail" class="h-full lg:h-[calc(100vh-3rem)] overflow-y-auto thin-scroll lg:border lg:border-paper-line lg:rounded-2xl bg-paper-2"></div>
      </div>
    </aside>
  </div>

  <footer class="border-t border-paper-line mt-10">
    <div class="max-w-[1500px] mx-auto px-5 lg:px-10 py-6 flex flex-wrap justify-between gap-3 font-mono text-[11px] text-bone-mute">
      <span>Lee antes de pulsar Intro. Prueba en laboratorio antes que en producción.</span>
      <span>↑ ↓ navegar · Intro abrir · Ctrl K buscar · Alt 1/2/3 sistema</span>
    </div>
  </footer>

  <div id="toast" role="status" class="pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] opacity-0 translate-y-2 transition duration-200
       bg-bone text-paper font-mono text-xs px-4 py-2.5 rounded-full shadow-2xl"></div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
