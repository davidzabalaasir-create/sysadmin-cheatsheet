<!DOCTYPE html>
<!-- Plantilla del icono de la app. La usa scripts/make-icons.js (Edge/Chrome headless). -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "Instrument Serif"; font-style: normal; src: url("../assets/fonts/instrument-serif-latin-400-normal.woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../assets/fonts/instrument-serif-latin-400-italic.woff2"); }
  html, body { margin: 0; width: 100vw; height: 100vh; background: #141310; overflow: hidden; }
  .icon { width: 100vw; height: 100vh; display: grid; place-items: center; }
  .mark { position: relative; font-family: "Instrument Serif", Georgia, serif; font-size: 59vw; line-height: 1; color: #ece6d9; transform: translateY(-3vw); }
  .mark em { color: #ffb454; }
  .mark::after { content: ""; position: absolute; left: 50%; bottom: -3vw; width: 34vw; height: 1.8vw; transform: translateX(-50%); background: #ffb454; }
</style></head>
<body><div class="icon"><div class="mark">S<em>a</em></div></div></body></html>
