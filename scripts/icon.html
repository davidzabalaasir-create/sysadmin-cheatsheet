<!DOCTYPE html>
<!-- Plantilla del icono de la app (PNG). La usa scripts/make-icons.js (Edge/Chrome headless).
     Mismo dibujo que assets/icons/favicon.svg, a sangre y con el símbolo dentro de la zona segura
     de los iconos «maskable» (el sistema recorta las esquinas a su manera). -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: #0d1412; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style></head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <rect width="64" height="64" fill="#0d1412"/>
    <g transform="translate(32 32) scale(.82) translate(-32 -32)">
      <path d="M19 21 L31 32 L19 43" fill="none" stroke="#34d399" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 44 H46" fill="none" stroke="#e3ece8" stroke-width="6.5" stroke-linecap="round"/>
    </g>
  </svg>
</body></html>
