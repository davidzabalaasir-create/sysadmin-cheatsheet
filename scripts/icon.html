<!DOCTYPE html>
<!-- Plantilla del icono de la app. La usa scripts/make-icons.js (Edge/Chrome headless). -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../assets/fonts/ibm-plex-sans-latin-600-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../assets/fonts/ibm-plex-sans-latin-400-normal.woff2"); }
  html, body { margin: 0; width: 100vw; height: 100vh; background: #0d1412; overflow: hidden; }
  .icon { width: 100vw; height: 100vh; display: grid; place-items: center; }
  .mark { position: relative; font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 52vw; font-weight: 600; letter-spacing: -3vw; line-height: 1; color: #e3ece8; transform: translateY(-3vw); }
  .mark em { color: #34d399; font-style: normal; }
  .mark::after { content: ""; position: absolute; left: 50%; bottom: -3vw; width: 34vw; height: 1.8vw; transform: translateX(-50%); background: #34d399; }
</style></head>
<body><div class="icon"><div class="mark">S<em>a</em></div></div></body></html>
