<!DOCTYPE html>
<!-- Plantilla de la imagen para compartir (1200×630). La usa scripts/make-icons.js. -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../assets/fonts/ibm-plex-sans-latin-600-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../assets/fonts/ibm-plex-sans-latin-400-normal.woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../assets/fonts/ibm-plex-mono-latin-400-normal.woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("../assets/fonts/ibm-plex-mono-latin-600-normal.woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d1412; color: #e3ece8; }
  .wrap { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; color: #8a9a94; }
  h1 { font-family: "IBM Plex Sans", system-ui, sans-serif; font-weight: 600; font-size: 116px; line-height: .95; margin: 22px 0 0; letter-spacing: -4px; }
  h1 em { color: #34d399; font-style: normal; }
  h1 { display: flex; align-items: center; }
  .logo { width: 104px; height: 104px; margin-right: 26px; }
  .rule { width: 260px; height: 6px; background: #34d399; margin: 26px 0 30px; }
  .tag { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 34px; line-height: 1.2; color: #a5b5ae; max-width: 660px; }
  .term { position: absolute; right: 72px; top: 150px; width: 330px; border: 1px solid #31443d; border-radius: 16px; background: #080d0b; font-family: "IBM Plex Mono", monospace; font-size: 17px; line-height: 1.75; }
  .term .bar { padding: 12px 18px; border-bottom: 1px solid #22302b; color: #8a9a94; font-size: 14px; }
  .term pre { margin: 0; padding: 16px 18px; white-space: pre; }
  .c { color: #34d399; font-weight: 600; } .f { color: #8cc4ff; } .s { color: #9fd8a6; }
  .stats { margin-top: 44px; display: flex; gap: 34px; font-family: "IBM Plex Mono", monospace; font-size: 20px; color: #8a9a94; }
  .stats b { color: #e3ece8; font-weight: 600; }
</style></head>
<body><div class="wrap">
  <div class="kicker">Linux · Windows · Redes</div>
  <h1><img class="logo" src="../assets/icons/favicon.svg" alt="">Sys<em>admin</em></h1>
  <div class="rule"></div>
  <div class="tag">Biblioteca de comandos para administradores de sistemas, con ejemplos reales.</div>
  <div class="term"><div class="bar">root@srv01:~#</div><pre><span class="c">ss</span> <span class="f">-tulnp</span>
<span class="c">journalctl</span> <span class="f">-u</span> ssh
<span class="c">Get-ADUser</span> <span class="f">-Filter</span> *
<span class="c">kubectl</span> get pods <span class="f">-A</span>
<span class="c">docker</span> compose up <span class="f">-d</span>
<span class="c">show</span> ip int brief</pre></div>
  <div class="stats"><span><b>546</b> comandos</span><span><b>15</b> categorías</span><span>ES · EN</span><span>sin conexión</span></div>
</div></body></html>
